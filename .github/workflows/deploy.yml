name: Deploy

# Validates every PR, deploys only when something lands on main.
# Runs on a self-hosted runner installed on the deploy host, so the deploy step
# executes on the machine itself - nothing needs to reach in from the internet.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys touch the same stack at once.
concurrency:
  group: deploy-tnbcheck
  cancel-in-progress: false

env:
  # Stable deploy checkout on the server. Deliberately NOT the runner's own
  # _work directory: this clone is never `git clean`-ed, so the untracked
  # .env (secrets) and certs/ survive every deploy.
  #
  # Override per-repository with a `DEPLOY_DIR` repository variable
  # (Settings -> Secrets and variables -> Actions -> Variables).
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/srv/tnbcheck' }}

jobs:
  verify:
    name: Typecheck, lint & build
    runs-on: [self-hosted, tnbcheck]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /tnbcheck/

  deploy:
    name: Deploy to server
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, tnbcheck]
    steps:
      # Keep git from prompting for credentials on a non-interactive run.
      - name: Configure git
        run: git config --global --add safe.directory "$DEPLOY_DIR"

      - name: Sync deploy checkout
        run: |
          if [ -d "$DEPLOY_DIR/.git" ]; then
            git -C "$DEPLOY_DIR" fetch --prune origin
            git -C "$DEPLOY_DIR" checkout main
            git -C "$DEPLOY_DIR" reset --hard origin/main
          else
            git clone https://github.com/${{ github.repository }}.git "$DEPLOY_DIR"
          fi

      - name: Check .env exists
        run: |
          if [ ! -f "$DEPLOY_DIR/.env" ]; then
            echo "Missing $DEPLOY_DIR/.env - copy .env.example and fill it in once on the server."
            exit 1
          fi

      - name: Build & restart stack
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

      - name: Wait for the app to report healthy
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          # Delegate to the container's own healthcheck rather than probing
          # with wget here: a second probe written as `http://localhost/...`
          # resolves to ::1 inside the container while nginx listens on IPv4
          # only, which fails even though the container is serving fine.
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' tnbcheck_app 2>/dev/null)" = "healthy" ]; then
              echo "tnbcheck_app is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "app did not become healthy in time"
          docker inspect -f '{{json .State.Health}}' tnbcheck_app || true
          docker compose -f docker-compose.prod.yml logs --tail 50 app
          exit 1

      - name: Reclaim disk
        if: always()
        run: docker image prune -f --filter "until=168h"
