server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Meter photos get POSTed through the n8n webhook, so allow decent uploads.
    client_max_body_size 25m;

    # Docker's embedded DNS. Combined with the variable proxy_pass below, this
    # resolves upstreams per-request instead of only at nginx startup, so the
    # backend containers can restart without taking this one down with them.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # --- internal API routes -------------------------------------------------
    # These live INSIDE the app's own /tnbcheck prefix. That is deliberate:
    # Nginx Proxy Manager only ever needs ONE custom location per app
    # (/tnbcheck -> this container), so shipping another app never means
    # touching NPM's routing.
    #
    # `rewrite ... break` strips the prefix, which a variable-based
    # proxy_pass cannot do on its own.

    location /tnbcheck/api/n8n/ {
        set $n8n_upstream tnbcheck_n8n:5678;
        rewrite ^/tnbcheck/api/n8n/(.*)$ /$1 break;
        proxy_pass http://$n8n_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Gemini reads the meter photo; give it room to answer.
        proxy_read_timeout 300s;
    }

    location /tnbcheck/api/meter/ {
        set $meter_upstream tnbcheck_local_api:3001;
        rewrite ^/tnbcheck/api/meter/(.*)$ /$1 break;
        proxy_pass http://$meter_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- static SPA ----------------------------------------------------------
    # Built files literally live under /usr/share/nginx/html/tnbcheck, so
    # requests pass through untouched and Vite's base='/tnbcheck/' asset URLs
    # resolve directly - no alias needed.
    location /tnbcheck/ {
        try_files $uri $uri/ /tnbcheck/index.html;
    }

    location = /tnbcheck {
        return 301 /tnbcheck/;
    }

    # Everything else belongs to other apps behind Nginx Proxy Manager.
    location / {
        return 404;
    }
}
